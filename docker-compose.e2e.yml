services:
  mongodb:
    image: mongo:8.0
    ports:
      - "127.0.0.1:27018:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 2s
      timeout: 5s
      retries: 30

  backend:
    build: ./backend
    ports:
      - "127.0.0.1:8086:8080"
    environment:
      SERVER_PORT: "8080"
      SPRING_MONGODB_URI: mongodb://mongodb:27017/codedrive_e2e
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/127.0.0.1/8080"]
      interval: 2s
      timeout: 3s
      start_period: 20s
      retries: 30
