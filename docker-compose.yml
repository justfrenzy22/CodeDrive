services:

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8085

    image: codedrive-frontend:local

    container_name: codedrive-frontend

    ports:
      - "3030:3030"

    depends_on:
      - backend

    restart: unless-stopped


  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    image: codedrive-backend:local

    container_name: codedrive-backend

    ports:
      - "8085:8085"

    environment:
      SPRING_DATA_MONGODB_URI: mongodb://mongodb:27017/codedrive

    depends_on:
      - mongodb

    restart: unless-stopped


  mongodb:
    image: mongo:8.0

    container_name: codedrive-mongodb

    ports:
      - "27017:27017"

    volumes:
      - mongodb_data:/data/db

    restart: unless-stopped


volumes:
  mongodb_data: