services:

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    image: ${FRONTEND_IMAGE:-codedrive-frontend:local}

    container_name: codedrive-frontend

    ports:
      - "${FRONTEND_PORT:-3030}:3030"

    environment:
      BACKEND_API_URL: http://backend:8080

    depends_on:
      backend:
        condition: service_healthy

    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3030').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 2s
      timeout: 5s
      start_period: 10s
      retries: 30

    restart: unless-stopped


  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    image: ${BACKEND_IMAGE:-codedrive-backend:local}

    container_name: codedrive-backend

    ports:
      - "${BACKEND_PORT:-8085}:8080"

    environment:
      SERVER_PORT: "8080"
      SPRING_MONGODB_URI: mongodb://mongodb:27017/codedrive

    depends_on:
      mongodb:
        condition: service_healthy

    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/127.0.0.1/8080"]
      interval: 2s
      timeout: 3s
      start_period: 20s
      retries: 30

    restart: unless-stopped


  mongodb:
    image: mongo:8.0

    container_name: codedrive-mongodb

    ports:
      - "27017:27017"

    volumes:
      - mongodb_data:/data/db

    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 2s
      timeout: 5s
      retries: 30

    restart: unless-stopped


volumes:
  mongodb_data:
