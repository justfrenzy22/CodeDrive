name: Backend CI/CD

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "docker-compose.yml"
      - ".github/workflows/backend-ci-cd.yml"
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - "docker-compose.yml"
      - ".github/workflows/backend-ci-cd.yml"

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    shell: powershell
    working-directory: backend

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/codedrive-backend
  FRONTEND_PORT: ${{ vars.FRONTEND_PORT || '3030' }}
  BACKEND_PORT: ${{ vars.BACKEND_PORT || '8085' }}

jobs:
  build:
    name: Build backend
    runs-on: [self-hosted, Windows, X64]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Compile and package backend
        run: .\gradlew.bat clean assemble --no-daemon --console=plain

      - name: Upload backend JAR
        uses: actions/upload-artifact@v4
        with:
          name: backend-build
          path: backend/build/libs/*.jar
          if-no-files-found: error

  unit_tests:
    name: Run unit tests
    needs: build
    runs-on: [self-hosted, Windows, X64]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Run unit tests
        run: .\gradlew.bat clean test --tests "com.codedrive.backend.unit.*" --no-daemon --console=plain

      - name: Upload unit test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-unit-test-results
          path: |
            backend/build/reports/tests/test/
            backend/build/test-results/test/

  integration_tests:
    name: Run integration tests
    needs: unit_tests
    runs-on: [self-hosted, Windows, X64]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Run integration tests
        run: .\gradlew.bat clean test --tests "com.codedrive.backend.integration.*" --no-daemon --console=plain

      - name: Upload integration test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-integration-test-results
          path: |
            backend/build/reports/tests/test/
            backend/build/test-results/test/

  docker:
    name: Build Docker image
    needs: integration_tests
    runs-on: [self-hosted, Windows, X64]
    defaults:
      run:
        working-directory: .
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build Docker image
        run: docker build --tag "codedrive-backend:$env:GITHUB_SHA" --file backend/Dockerfile backend

      - name: Save Docker image
        run: docker image save --output backend-image.tar "codedrive-backend:$env:GITHUB_SHA"

      - name: Upload Docker image
        uses: actions/upload-artifact@v4
        with:
          name: backend-docker-image
          path: backend-image.tar
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

  publish:
    name: Publish image to GHCR
    needs: docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Windows, X64]
    permissions:
      contents: read
      packages: write
    defaults:
      run:
        working-directory: .
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download Docker image
        uses: actions/download-artifact@v4
        with:
          name: backend-docker-image

      - name: Load Docker image
        run: docker image load --input backend-image.tar

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag and publish image
        run: |
          $image = "$env:REGISTRY/$env:IMAGE_NAME".ToLowerInvariant()
          foreach ($tag in @("latest", $env:GITHUB_SHA)) {
            docker tag "codedrive-backend:$env:GITHUB_SHA" "$($image):$tag"
            if ($LASTEXITCODE -ne 0) { throw "Failed to tag image as $tag" }

            docker push "$($image):$tag"
            if ($LASTEXITCODE -ne 0) { throw "Failed to publish image tagged $tag" }
          }

  deploy:
    name: Deploy backend on this machine
    needs: publish
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Windows, X64]
    concurrency:
      group: codedrive-deployment
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    defaults:
      run:
        working-directory: .
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Select the image published for this commit
        run: |
          $image = "$env:REGISTRY/$env:IMAGE_NAME".ToLowerInvariant()
          "BACKEND_IMAGE=$($image):$env:GITHUB_SHA" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull the backend image and MongoDB
        run: docker compose --project-name codedrive --file docker-compose.yml pull backend mongodb

      - name: Start or update the backend
        run: docker compose --project-name codedrive --file docker-compose.yml up --detach --no-build --wait --wait-timeout 120 backend

      - name: Show deployment status
        run: docker compose --project-name codedrive --file docker-compose.yml ps backend mongodb

      - name: Show logs if deployment fails
        if: failure()
        run: docker compose --project-name codedrive --file docker-compose.yml logs --tail 100 backend mongodb
